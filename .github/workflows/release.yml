name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload assets for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: |
          export LUMIERE_VERSION="${RELEASE_TAG#v}"
          cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive and checksum
        shell: bash
        run: |
          archive="lumiere-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/lumiere" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "$archive" -C "$stage" .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lumiere-${{ matrix.target }}
          path: |
            lumiere-*.tar.gz
            lumiere-*.tar.gz.sha256

  publish:
    name: Upload Release Assets
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
