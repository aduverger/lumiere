[package]
name = "lumiere-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"
description = "Review diffs in the terminal and discuss them with your coding agent."
homepage = "https://lumiere.computer"
repository = "https://github.com/aduverger/lumiere"
readme = "README.md"
keywords = ["cli", "terminal", "git", "diff", "review"]
categories = ["command-line-interface", "command-line-utilities"]
exclude = [
  "assets/",
  "bench/",
  "docs/",
  "pi-extension/",
  "plan-*.md",
  "flake.nix",
  "flake.lock",
  "install.sh",
  ".cargo/",
  ".github/",
  "release-plz.toml",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/lumiere-v{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "lumiere"
path = "src/lib.rs"

[[bin]]
name = "lumiere"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6.0.0"
ratatui = "0.30"
crossterm = "0.29"
similar = { version = "3.2", features = ["inline", "unicode"] }
notify = "8.2"
tree-sitter = "0.24"
streaming-iterator = "0.1"
tree-sitter-highlight = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-json = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-toml-ng = "0.7"
tree-sitter-bash = "0.23"
tree-sitter-md = "0.3"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-elixir = "0.3"
tree-sitter-java = "0.23"
tree-sitter-zig = "1.1.2"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
arboard = { version = "3.4", features = ["wayland-data-control"] }
nucleo-matcher = "0.3"
ratatui-textarea = "0.9"
sha2 = "0.10"
shlex = "1.3"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
jj-lib = { version = "0.47.1", features = ["git"], optional = true }
jiff = { version = "0.2", optional = true }
pollster = { version = "0.4", optional = true }
futures = { version = "0.3", optional = true }
terminal-light = "1.8.0"
pulldown-cmark = { version = "0.13", default-features = false }

[features]
default = ["jj"]
jj = ["jj-lib", "jiff", "pollster", "futures"]

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
